name: Android APK Derleyici

on:
  push:
    branches: [ "main", "ana" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodlari Depodan Cek
      uses: actions/checkout@v4

    - name: Java JDK 17 Ortamini Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Android Proje Yapısını Enjekte Et
      run: |
        # 1. Gerekli tüm Android klasör mimarisini oluşturuyoruz
        mkdir -p app/src/main/java/com/hardware/batterymonitor/core
        mkdir -p app/src/main/java/com/hardware/batterymonitor/services
        mkdir -p app/src/main/java/com/hardware/batterymonitor/ui
        
        # 2. Yüklediğin ham dosyaları doğru paket yollarına isimlerini düzelterek taşıyoruz
        [ -f AndroidManifest.xml.txt ] && mv AndroidManifest.xml.txt app/src/main/AndroidManifest.xml
        [ -f MainActivity.kt.txt ] && mv MainActivity.kt.txt app/src/main/java/com/hardware/batterymonitor/MainActivity.kt
        [ -f BatteryHardwareManager.kotlin.txt ] && mv BatteryHardwareManager.kotlin.txt app/src/main/java/com/hardware/batterymonitor/core/BatteryHardwareManager.kt
        [ -f BatteryMonitorService.kotlin.txt ] && mv BatteryMonitorService.kotlin.txt app/src/main/java/com/hardware/batterymonitor/services/BatteryMonitorService.kt
        [ -f BatteryViewModel.kt.txt ] && mv BatteryViewModel.kt.txt app/src/main/java/com/hardware/batterymonitor/ui/BatteryViewModel.kt
        [ -f BatteryDashboardScreen.kotlin.txt ] && mv BatteryDashboardScreen.kotlin.txt app/src/main/java/com/hardware/batterymonitor/ui/BatteryDashboardScreen.kt

        # 3. Gradle motorunun takılmadan çalışması için çatı ayar dosyalarını doğrudan oluşturuyoruz
        echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }; dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }; rootProject.name = \"BataryaRontgeni\"; include(\":app\")" > settings.gradle.kts
        echo "plugins { id(\"com.android.application\") version \"8.1.1\" apply false; id(\"org.jetbrains.kotlin.android\") version \"1.8.10\" apply false }" > build.gradle.kts
        
        # 4. Uygulamanın derleme ve kütüphane bağımlılıklarını yazıyoruz
        echo -e "plugins { id(\"com.android.application\"); id(\"org.jetbrains.kotlin.android\") }\nandroid { compileSdk = 33; namespace = \"com.hardware.batterymonitor\"; defaultConfig { applicationId = \"com.hardware.batterymonitor\"; minSdk = 24; targetSdk = 33; versionCode = 1; versionName = \"1.0\" }; buildFeatures { compose = true }; composeOptions { kotlinCompilerExtensionVersion = \"1.4.3\" }; kotlinOptions { jvmTarget = \"17\" } }\ndependencies { implementation(\"androidx.core:core-ktx:1.10.1\"); implementation(\"androidx.lifecycle:lifecycle-runtime-ktx:2.6.1\"); implementation(\"androidx.activity:activity-compose:1.7.2\"); implementation(platform(\"androidx.compose:compose-bom:2023.05.01\")); implementation(\"androidx.compose.ui:ui\"); implementation(\"androidx.compose.ui:ui-graphics\"); implementation(\"androidx.compose.ui:ui-tooling-preview\"); implementation(\"androidx.compose.material3:material3\") }" > app/build.gradle.kts

    - name: Yerel Gradle Sürücüsünü Kur
      run: gradle wrapper --gradle-version 8.1.1

    - name: Motoru Ateşle ve APK Derle
      run: ./gradlew assembleDebug

    - name: APK Dosyasını İndirmeye Hazırla
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Batarya-Rontgeni-APK
        path: app/build/outputs/apk/debug/app-debug.apk
